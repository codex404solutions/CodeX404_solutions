<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sophia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#831843" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <linearGradient id="jacket-sophia" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#500724" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="skin-sophia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="hair-sophia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow-sophia" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F472B6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg-sophia)" stroke="#F472B6" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FBCFE8" stroke-dasharray="3,3" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Hair Behind Shoulders -->
  <path d="M52 90 C48 140 52 185 62 200 L138 200 C148 185 152 140 148 90 Z" fill="url(#hair-sophia)"/>

  <!-- Body / Autonomous AI Engineer Blazer -->
  <path d="M42 200 C42 148 72 144 100 144 C128 144 158 148 158 200 Z" fill="url(#jacket-sophia)"/>
  
  <!-- Modern Rose Gold / Cyberpunk Inner Top -->
  <polygon points="100,146 78,144 100,186 122,144" fill="#EC4899"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="26" rx="4" fill="#FEF08A"/>

  <!-- Head Base -->
  <ellipse cx="100" cy="94" rx="32" ry="38" fill="#FEF08A"/>

  <!-- Sleek Long Hair with Bangs -->
  <path d="M62 90 C60 52 76 45 100 45 C124 45 140 52 138 90 C136 120 134 138 128 150 C122 138 124 96 118 84 C110 68 90 68 82 84 C76 96 78 138 72 150 C66 138 64 120 62 90 Z" fill="url(#hair-sophia)" filter="url(#glow-sophia)"/>

  <!-- Modern AI Specialist Glasses -->
  <rect x="75" y="85" width="22" height="14" rx="4" fill="rgba(244, 114, 182, 0.15)" stroke="#F472B6" stroke-width="1.8"/>
  <rect x="103" y="85" width="22" height="14" rx="4" fill="rgba(244, 114, 182, 0.15)" stroke="#F472B6" stroke-width="1.8"/>
  <line x1="97" y1="91" x2="103" y2="91" stroke="#F472B6" stroke-width="1.8"/>

  <!-- Eyes & Eyebrows (behind stylish glasses) -->
  <path d="M78 80 Q86 77 94 80" fill="none" stroke="#09090B" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M106 80 Q114 77 122 80" fill="none" stroke="#09090B" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="86" cy="92" rx="3" ry="3.5" fill="#09090B"/>
  <ellipse cx="114" cy="92" rx="3" ry="3.5" fill="#09090B"/>
  <circle cx="87" cy="91" r="1.1" fill="#FFFFFF"/>
  <circle cx="115" cy="91" r="1.1" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M100 89 L98 100 L102 100" fill="none" stroke="#EAB308" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Tech/Science Smile -->
  <path d="M92 114 Q100 120 108 114" fill="none" stroke="#DB2777" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Outer Ring Accent -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#F472B6" stroke-width="2"/>
</svg>
