<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-elena" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="blazer-elena" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="skin-elena" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>
    <linearGradient id="hair-elena" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glow-elena" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#A78BFA" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg-elena)" stroke="#A78BFA" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#C084FC" stroke-dasharray="3,3" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Hair Behind Shoulders -->
  <path d="M54 90 C50 140 54 180 64 200 L136 200 C146 180 150 140 146 90 Z" fill="url(#hair-elena)"/>

  <!-- Body / Tech Executive Blazer -->
  <path d="M42 200 C42 148 72 144 100 144 C128 144 158 148 158 200 Z" fill="url(#blazer-elena)"/>
  
  <!-- Modern Indigo V-Neck Inner -->
  <polygon points="100,146 80,144 100,186 120,144" fill="#6366F1"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="26" rx="4" fill="url(#skin-elena)"/>

  <!-- Head Base -->
  <ellipse cx="100" cy="94" rx="32" ry="38" fill="url(#skin-elena)"/>

  <!-- Hair Flow & CTO Bob Style -->
  <path d="M60 90 C58 55 76 46 100 46 C124 46 142 55 140 90 C138 120 134 135 130 145 C122 135 124 100 120 90 C110 65 90 65 80 90 C76 100 78 135 70 145 C66 135 62 120 60 90 Z" fill="url(#hair-elena)" filter="url(#glow-elena)"/>

  <!-- Eyes & Eyebrows -->
  <path d="M78 81 Q86 78 94 81" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M106 81 Q114 78 122 81" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="86" cy="92" rx="3.2" ry="3.8" fill="#1E1B4B"/>
  <ellipse cx="114" cy="92" rx="3.2" ry="3.8" fill="#1E1B4B"/>
  <circle cx="87" cy="91" r="1.2" fill="#FFFFFF"/>
  <circle cx="115" cy="91" r="1.2" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M100 90 L98 101 L103 101" fill="none" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Professional CTO Smile with Lipstick -->
  <path d="M92 115 Q100 122 108 115" fill="none" stroke="#E11D48" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Modern Purple-Trim Glasses -->
  <rect x="76" y="86" width="20" height="13" rx="3" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.9"/>
  <rect x="104" y="86" width="20" height="13" rx="3" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.9"/>
  <line x1="96" y1="92" x2="104" y2="92" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.9"/>

  <!-- Outer Ring Accent -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#A78BFA" stroke-width="2"/>
</svg>
