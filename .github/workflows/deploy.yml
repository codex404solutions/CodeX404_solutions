name: Deploy Website to Hostinger

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy Website to Production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USERNAME_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          port: 21
          protocol: ftp
          local-dir: ./website/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/*.md
            **/.env
            **/.env.example
            **/tests/**
            **/storage/logs/**
            **/storage/cache/**
            **/storage/sessions/**
            **/.DS_Store
            **/Thumbs.db
            **/*.bak

      - name: ✅ Deployment Complete
        run: |
          echo "✅ Website deployed to codex404solutions.online"
          echo "📅 Deployment time: $(date)"

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧪 Deploy Website to Dev Environment
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./website/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/*.md
            **/.env
            **/.env.example
            **/tests/**
            **/storage/logs/**
            **/storage/cache/**
            **/storage/sessions/**
            **/.DS_Store
            **/Thumbs.db
            **/*.bak

      - name: ✅ Dev Deployment Complete
        run: |
          echo "✅ Website deployed to dev.codex404solutions.online"
          echo "📅 Deployment time: $(date)"
