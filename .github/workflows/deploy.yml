name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - dev
jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Deploy to Production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USERNAME_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          port: 21
          protocol: ftp
          local-dir: ./codex404/
          server-dir: /
          exclude: |
            **/.git*
            **/.github/**
            **/*.md
            **/*.bat
            **/*.py
            **/deploy.yml
            **/tests/**
            **/*.yml
            **/README.md
            .git/**
            .github/**
            **/*.doc
            **/*.sql
            **/*.zip

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Deploy to Dev Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          port: 21
          protocol: ftp
          local-dir: ./codex404/
          server-dir: /
          exclude: |
            **/.git*
            **/.github/**
            **/*.md
            **/*.bat
            **/*.py
            **/deploy.yml
            **/tests/**
            **/*.yml
            **/README.md
            .git/**
            .github/**
            **/*.doc
            **/*.sql
            **/*.zip

# This workflow automates the deployment of the codex404 project to Hostinger's FTP servers. It triggers on pushes to the main and dev branches, deploying to the production server for main and the development server for dev. The workflow uses the SamKirkland/FTP-Deploy-Action to handle the FTP deployment, excluding certain files and directories from being uploaded.
