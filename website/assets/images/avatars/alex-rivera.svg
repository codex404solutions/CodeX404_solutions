<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-alex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="suit-alex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="tie-alex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="skin-alex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="hair-alex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow-alex" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg-alex)" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#38BDF8" stroke-dasharray="4,4" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Body / Executive Suit -->
  <path d="M40 200 C40 148 70 142 100 142 C130 142 160 148 160 200 Z" fill="url(#suit-alex)"/>
  
  <!-- Crisp White Shirt Collar -->
  <polygon points="100,150 82,142 90,172 100,180 110,172 118,142" fill="#F8FAFC"/>
  
  <!-- Executive Cyan Tie -->
  <polygon points="100,152 105,160 100,195 95,160" fill="url(#tie-alex)" filter="url(#glow-alex)"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="26" rx="4" fill="url(#skin-alex)"/>

  <!-- Head Base -->
  <ellipse cx="100" cy="94" rx="34" ry="40" fill="url(#skin-alex)"/>

  <!-- Executive Hair Cut -->
  <path d="M66 84 C66 60 80 50 100 50 C120 50 134 60 134 84 C134 88 132 72 120 62 C108 52 88 56 78 68 C70 76 66 84 66 84 Z" fill="url(#hair-alex)"/>

  <!-- Eyes & Eyebrows -->
  <rect x="80" y="80" width="12" height="3" rx="1.5" fill="#334155"/>
  <rect x="108" y="80" width="12" height="3" rx="1.5" fill="#334155"/>
  <ellipse cx="86" cy="92" rx="3" ry="3.5" fill="#0F172A"/>
  <ellipse cx="114" cy="92" rx="3" ry="3.5" fill="#0F172A"/>
  <circle cx="87" cy="91" r="1" fill="#FFFFFF"/>
  <circle cx="115" cy="91" r="1" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M100 90 L98 102 L103 102" fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round"/>

  <!-- Confident Executive Smile -->
  <path d="M92 114 Q100 121 108 114" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtle Trim / Glasses (Modern Founder Rimless) -->
  <rect x="76" y="86" width="20" height="13" rx="3" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
  <rect x="104" y="86" width="20" height="13" rx="3" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="96" y1="92" x2="104" y2="92" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Outer Tech Border Ring Indicator -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#38BDF8" stroke-width="2"/>
</svg>
