<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-marcus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="suit-marcus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="skin-marcus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="hair-marcus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow-marcus" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg-marcus)" stroke="#34D399" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#6EE7B7" stroke-dasharray="4,4" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Body / Emerald Sales Executive Suit -->
  <path d="M40 200 C40 148 70 142 100 142 C130 142 160 148 160 200 Z" fill="url(#suit-marcus)"/>
  
  <!-- Crisp Light Shirt -->
  <polygon points="100,150 82,142 90,172 100,180 110,172 118,142" fill="#ECFDF5"/>
  
  <!-- Gold Sales Leader Tie -->
  <polygon points="100,152 105,160 100,195 95,160" fill="#F59E0B" filter="url(#glow-marcus)"/>

  <!-- Neck -->
  <rect x="88" y="118" width="24" height="26" rx="4" fill="url(#skin-marcus)"/>

  <!-- Head Base -->
  <ellipse cx="100" cy="94" rx="34" ry="40" fill="url(#skin-marcus)"/>

  <!-- Short Professional Crop Hair -->
  <path d="M66 84 C66 58 78 48 100 48 C122 48 134 58 134 84 C134 88 130 68 122 58 C112 48 88 48 78 58 C70 68 66 84 66 84 Z" fill="url(#hair-marcus)"/>

  <!-- Trimmed Professional Beard -->
  <path d="M72 98 C72 130 82 142 100 142 C118 142 128 130 128 98 C128 106 122 134 100 134 C78 134 72 106 72 98 Z" fill="url(#hair-marcus)" opacity="0.9"/>

  <!-- Eyes & Eyebrows -->
  <rect x="80" y="80" width="13" height="3" rx="1.5" fill="#18181B"/>
  <rect x="107" y="80" width="13" height="3" rx="1.5" fill="#18181B"/>
  <ellipse cx="86" cy="92" rx="3" ry="3.5" fill="#18181B"/>
  <ellipse cx="114" cy="92" rx="3" ry="3.5" fill="#18181B"/>
  <circle cx="87" cy="91" r="1" fill="#FFFFFF"/>
  <circle cx="115" cy="91" r="1" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M100 90 L97 103 L103 103" fill="none" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>

  <!-- Warm, Persuasive Sales Smile -->
  <path d="M91 114 Q100 122 109 114" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Outer Tech Border Ring Indicator -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#34D399" stroke-width="2"/>
</svg>
